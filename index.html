<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свадьба Булата и Азалии</title>
    <style>
        /* Основные настройки страницы */
        body {
            margin: 0;
            padding: 0;
            background-color: #58181f; /* Бордовый фон как на фото */
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section {
            width: 100%;
            max-width: 500px; /* Оптимально для смартфонов */
            line-height: 0; /* Убирает зазоры между картинками */
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Контейнер для формы */
        .form-section {
            width: 100%;
            max-width: 500px;
            background-color: #58181f;
            padding: 40px 0;
            text-align: center;
            line-height: normal;
        }

        .form-container {
            background: #f3ece4; /* Светлый фон внутри формы */
            margin: 0 20px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 10px;
        }

        h2 {
            color: #58181f;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .footer {
            color: #f3ece4;
            font-size: 0.8em;
            padding: 20px;
            opacity: 0.7;
        }
        /* Стиль для свадебной кнопки */
        .wedding-btn {
            display: inline-block;
            background-color: #58181f; /* Бордовый цвет */
            color: #f3ece4; /* Светло-кремовый текст */
            padding: 15px 35px;
            font-size: 1.1em;
            text-decoration: none;
            font-family: 'Georgia', serif;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            font-weight: bold;
        }

            .wedding-btn:hover {
                background-color: #7a222b; /* Чуть светлее при наведении */
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            }
    </style>
</head>
<body>

    <!-- Блок 1: Обложка -->
    <div class="section">
        <img src="1.jpg" alt="Булат и Азалия">
    </div>

    <!-- Блок 2: Тайминг -->
    <div class="section">
        <img src="2.jpg" alt="Тайминг">
    </div>

    <!-- Блок 3: Локация -->
    <div class="section">
        <img src="3.jpg" alt="Локация">
    </div>

    <!-- Блок 4: Дресс-код и детали -->
    <div class="section">
        <img src="4.jpg" alt="Дресс-код">
    </div>

    <!-- Блок 5: Призыв к действию -->
    <div class="section">
        <img src="5.jpg" alt="Подтвердите участие">
    </div>

    <!-- Блок 6: Кнопка для открытия анкеты -->
    <div class="form-section">
        <div class="form-container">
            <h2>Анкета гостя</h2>
            <p style="font-size: 0.9em; color: #58181f; margin-bottom: 25px; line-height: 1.4;">
                Пожалуйста, уделите минуту и ответьте на несколько вопросов, чтобы мы сделали этот день идеальным для вас.
            </p>

            <!-- КНОПКА (замените ссылку на свою обычную ссылку Яндекс Форм) -->
            <a href="https://forms.yandex.ru/u/6a4142a6902902087768af14/?page=1" target="_blank" class="wedding-btn">
                Заполнить анкету
            </a>
        </div>
        <div class="footer">Ждем вас на нашем празднике!</div>
    </div>

</body>
</html>

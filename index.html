<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свадьба Булата и Азалии</title>
    <style>
        /* Основные настройки страницы */
        body {
            margin: 0;
            padding: 0;
            background-color: white; /* Бордовый фон как на фото */
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .section {
            width: 100%;
            max-width: 500px; /* Оптимально для смартфонов */
            line-height: 0; /* Убирает зазоры между картинками */
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Контейнер для формы */
        .form-section {
            width: 100%;
            max-width: 500px;
            background-color: white;
            padding: 40px 0;
            text-align: center;
            line-height: normal;
        }

        .form-container {
            background: #f3ece4; /* Светлый фон внутри формы */
            margin: 0 20px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 10px;
        }

        h2 {
            color: #58181f;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .footer {
            color: #f3ece4;
            font-size: 0.8em;
            padding: 20px;
            opacity: 0.7;
        }
        /* Стиль для свадебной кнопки */
        .wedding-btn {
            display: inline-block;
            background-color: #58181f; /* Бордовый цвет */
            color: #f3ece4; /* Светло-кремовый текст */
            padding: 15px 35px;
            font-size: 1.1em;
            text-decoration: none;
            font-family: 'Georgia', serif;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            font-weight: bold;
        }

            .wedding-btn:hover {
                background-color: #7a222b; /* Чуть светлее при наведении */
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);

            }
        /* Стиль для кнопки "Вступить в чат" */
        .chat-btn {
            display: inline-block;
            background-color: #2b1f20; /* Цвет как на вашем фото */
            color: #ffffff; /* Белый текст */
            padding: 15px 40px;
            font-size: 1.2em;
            text-decoration: none;
            font-family: 'Georgia', serif;
            border-radius: 12px; /* Прямоугольник со скругленными краями */
            margin: 20px 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

            .chat-btn:hover {
                background-color: #4a3335; /* Чуть светлее при наведении */
                transform: scale(1.03);
            }
    </style>
</head>
<body>

    <!-- Блок 1: Обложка -->
    <div class="section">
        <img src="1.jpg" alt="Булат и Азалия">
    </div>

    <!-- Блок 2: Тайминг -->
    <div class="section">
        <img src="2.jpg" alt="Тайминг">
    </div>

    <!-- Блок 3: Локация -->
    <div class="section">
        <img src="3.jpg" alt="Локация">
    </div>

    <!-- Блок 4: Дресс-код и детали -->
    <div class="section">
        <img src="4.jpg" alt="Дресс-код">
    </div>

    <!-- Блок 5: Призыв к действию -->
    <div class="section">
        <img src="5.jpg" alt="Подтвердите участие">
    </div>
    <div class="section">
        <img src="6.jpg" alt="Подтвердите участие">
    </div>
    <div class="section">
        <img src="7.jpg" alt="Подтвердите участие">
    </div>
    <div class="block-wrapper bg-solid-red">
        <div class="form-container" style="background-color: transparent; box-shadow: none;">
            <a href="ВАША_ССЫЛКА_НА_ТЕЛЕГРАМ" target="_blank" class="chat-btn">
                Вступить в чат
            </a>
        </div>
    </div>
    <div class="section">
        <img src="8.jpg" alt="Подтвердите участие">
    </div>
    <div class="block-wrapper bg-solid-red">
        <div class="form-container" style="background-color: transparent; box-shadow: none;">
            <a href="https://forms.yandex.ru/u/6a4142a6902902087768af14/?page=1" target="_blank" class="chat-btn">
                Заполнить анкету
            </a>
        </div>
    </div>
   




</body>
</html>
